# Smart Cal Assistant — a tiny Swift helper app embedded in Smart Cal.app/Contents/Helpers.
#  • Siri / Shortcuts / Spotlight actions (App Intents) that talk to Smart Cal over a local socket
#  • Apple Intelligence (Foundation Models) for the AI box: `Smart Cal Assistant --fm` (stdin → stdout JSON)
# Generated into an Xcode project by xcodegen (build.sh does this).
name: SmartCalAssistant
options:
  bundleIdPrefix: company.sala
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  SmartCalAssistant:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: "Smart Cal Assistant"
        PRODUCT_BUNDLE_IDENTIFIER: company.sala.personalcalendar.assistant
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Smart Cal"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 go.sala.company"
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: "-weak_framework FoundationModels"
