# Compiles every push on a macOS runner (the app can only be built on macOS).
name: Build check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Build app
        run: ./build.sh --ci
      - name: Self-test the assistant (Siri + Apple Intelligence bridge)
        run: |
          H="build/Smart Cal.app/Contents/Helpers/Smart Cal Assistant.app/Contents/MacOS/Smart Cal Assistant"
          ls "build/Smart Cal.app/Contents/Helpers/Smart Cal Assistant.app/Contents/Resources/"
          echo "status: $("$H" --fm-status)"
          build/PersonalCalendar --dump-schemas | "$H" --fm-check
          echo '{"instructions":"Reply briefly.","prompt":"Say hi"}' | "$H" --fm; echo
          codesign -dv "build/Smart Cal.app" 2>&1 | head -5
          codesign --verify --deep --strict "build/Smart Cal.app" && echo "signature ok"
