# Compiles every push on a macOS runner (the app can only be built on macOS).
name: Build check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Build app
        run: ./build.sh --ci
      - name: Check signature
        run: |
          codesign -dv "build/Smart Cal.app" 2>&1 | head -5
          codesign --verify --strict "build/Smart Cal.app" && echo "signature ok"
      - name: Check the release zip the way the updater does
        run: |
          rm -rf build/unz && ditto -x -k build/SmartCal-*-macos-arm64.zip build/unz
          codesign --verify --strict "build/unz/Personal Calendar.app" && echo "unpacked signature ok"
