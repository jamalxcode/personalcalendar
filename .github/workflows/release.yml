# Publishes a GitHub release whenever VERSION changes on main (or on demand).
# The app's Update button downloads the zip attached to the latest release.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          V=$(tr -d ' \n' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$V is already released — bump VERSION to publish a new one"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.v.outputs.exists == 'false'
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test
        if: steps.v.outputs.exists == 'false'
        run: |
          go vet ./...
          go test ./...

      - name: Build app
        if: steps.v.outputs.exists == 'false'
        run: |
          sw_vers; xcodebuild -version || true; go version
          ./build.sh --ci

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          NOTES=$(awk -v v="$V" '$0 ~ "^## v?"v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md | sed '/./,$!d')
          [ -n "$NOTES" ] || NOTES="Smart Cal v$V"
          ZIP="build/SmartCal-$V-macos-arm64.zip"
          # the app's updater checks the download against this before installing it
          (cd build && shasum -a 256 "SmartCal-$V-macos-arm64.zip" | awk '{print $1}' > "SmartCal-$V-macos-arm64.zip.sha256")
          gh release create "v$V" "$ZIP" "$ZIP.sha256" \
            --title "Smart Cal v$V" --notes "$NOTES" --target "$GITHUB_SHA"
